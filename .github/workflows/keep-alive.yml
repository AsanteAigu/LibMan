name: Keep backend awake

# Render's free web-service tier spins the app down after 15 minutes with no
# inbound HTTP traffic. This is a genuine external request every 10 minutes
# to /actuator/health, which resets that timer -- an in-process @Scheduled
# job wouldn't, since Render only counts real inbound requests as activity.
#
# One-time setup after the first Render deploy:
#   Repo -> Settings -> Secrets and variables -> Actions -> Variables ->
#   New repository variable RENDER_APP_URL = https://<your-app>.onrender.com
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ vars.RENDER_APP_URL }}" ]; then
            echo "RENDER_APP_URL repository variable is not set yet -- skipping until it is."
            exit 0
          fi
          curl -fsS "${{ vars.RENDER_APP_URL }}/actuator/health"
