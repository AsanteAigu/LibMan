spring:
  application:
    name: libman-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
    access:
      default: unrestricted

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  supabase:
    storage-url: ${SUPABASE_STORAGE_URL}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY}

logging:
  level:
    com.libman.api: INFO
